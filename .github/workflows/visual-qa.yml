# Template for surp-hovhannes/bahk: .github/workflows/visual-qa.yml
# Started on demand by pm-job/vqa (`gh workflow run visual-qa.yml --ref <PR branch>`).
# Boots Django exactly like django_ci.yml (SQLite + Redis service), loads
# deterministic seed data, creates a masked one-run admin, captures the admin
# scenarios with Playwright and uploads screenshots + manifest.json.
name: Visual QA

on:
  workflow_dispatch:
    inputs:
      plan:
        description: Visual QA plan JSON (name, viewports, scenarios)
        required: true
        type: string
      run_label:
        description: Correlation label chosen by vqa (letters, digits, dashes)
        required: true
        type: string

run-name: Visual QA ${{ inputs.run_label }}

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Same settings switches as django_ci.yml: CI mode, DEBUG so runserver serves static files.
      CI: "true"
      DEBUG: "true"
      REDIS_URL: redis://localhost:6379/1
      ALLOWED_HOSTS: 127.0.0.1,localhost
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Validate run label
        env:
          RUN_LABEL: ${{ inputs.run_label }}
        run: |
          [[ "$RUN_LABEL" =~ ^[A-Za-z0-9-]{6,64}$ ]] || { echo "invalid run_label"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Database and deterministic seed data
        run: |
          python manage.py migrate --noinput
          python manage.py seed_visual_qa

      - name: One-run admin user
        run: |
          VQA_PASSWORD="$(openssl rand -base64 24 | tr -d '/+=')"
          echo "::add-mask::$VQA_PASSWORD"
          echo "VQA_PASSWORD=$VQA_PASSWORD" >> "$GITHUB_ENV"
          DJANGO_SUPERUSER_PASSWORD="$VQA_PASSWORD" python manage.py createsuperuser --noinput \
            --username vqa-admin --email vqa-admin@example.test

      - name: Start Django
        run: |
          python manage.py runserver 127.0.0.1:8000 > runserver.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/admin/login/ && exit 0
            sleep 2
          done
          cat runserver.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: qa/visual
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Capture admin scenarios
        working-directory: qa/visual
        env:
          VQA_PLAN: ${{ inputs.plan }}
          VQA_BASE_URL: http://127.0.0.1:8000
          VQA_USER: vqa-admin
          VQA_LOGIN_KIND: django-admin
          VQA_SHA: ${{ github.sha }}
          VQA_OUT: ${{ github.workspace }}/qa-results
        run: node run.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ inputs.run_label }}
          path: qa-results
          retention-days: 14
          if-no-files-found: error
