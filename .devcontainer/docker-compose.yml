version: '3.8'

services:
  app: &django
    build: 
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/app
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  worker:
    <<: *django
    command: ["celery", "-A", "bahk", "worker", "--loglevel=info"]

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: 